name: Roadster public browser check
on:
  push:
    branches: [codex/pages-browser-check]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium --only-shell
      - run: node tests/pages-live.mjs
        env:
          EXPECTED_ASSET: roadster-e6bf26df66.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lineup-and-ramp
          path: |
            lineup.png
            ramp.png
